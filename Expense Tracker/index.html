<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <header>
      <h1>Expense Tracker</h1>
    </header>
    <div class="balance">
      <span>Your Balance</span>
      <span class="balance-span"></span>
    </div>
    <div class="income-expense">
      <div class="income">
        <span>INCOME</span><span class="income-span"></span>
      </div>
      <div class="expense">
        <span>EXPENSE</span><span class="expense-span"></span>
      </div>
    </div>

    <div class="history"></div>

    <div class="transactions">
      <p>Add New Transaction</p>
      <label for="text-detail">Text</label>
      <input type="text" id="text-detail" />
      <label for="amount"
        ><span>Amount</span
        ><span>(negative - expense, positive - income)</span></label
      >
      <input type="number" id="amount-input" />
      <button id="add-transaction">Add Transaction</button>
    </div>
    <script defer src="script.js"></script>
  </body>
</html>
